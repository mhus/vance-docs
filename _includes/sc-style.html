<style>
  :root {
    /* Ink & Amber — light "paper field guide" is the default look.
       The Guide's screen (hero device) stays dark either way. */
    --ground: #F4F2EA;
    --raised: #FBFAF4;
    --raised-2: #FFFFFF;
    --line: #E2DED1;
    --line-soft: #ECE8DD;
    --fg: #34393F;
    --fg-strong: #14181F;
    --muted: #5D626D;
    --faint: #928F82;
    --amber: #A85D00;
    --amber-soft: #8A4A00;
    --amber-ink: #FFF6EA;
    --live: #1C9A67;
    --mark: #1E3A8A;
    --shadow: 0 26px 64px -34px rgba(40,44,62,.30);

    --serif: "Charter","Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono: ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Cascadia Code","Roboto Mono",Consolas,monospace;

    --wrap: 1120px;
    --pad: clamp(20px, 5vw, 56px);
  }

  /* Explicit light (viewer toggle) — same as the default look */
  :root[data-theme="light"] {
    --ground: #F4F2EA; --raised: #FBFAF4; --raised-2: #FFFFFF;
    --line: #E2DED1; --line-soft: #ECE8DD; --fg: #34393F; --fg-strong: #14181F;
    --muted: #5D626D; --faint: #928F82; --amber: #A85D00; --amber-soft: #8A4A00;
    --amber-ink: #FFF6EA; --live: #1C9A67; --mark: #1E3A8A;
    --shadow: 0 26px 64px -34px rgba(40,44,62,.30);
  }

  /* Dark — opt-in via the theme toggle */
  :root[data-theme="dark"] {
    --ground: #0B0E15; --raised: #121826; --raised-2: #0E1320;
    --line: #212A3D; --line-soft: #19212F; --fg: #E7EAF1; --fg-strong: #FBFCFE;
    --muted: #93A0B8; --faint: #5B6683; --amber: #F2B23D; --amber-soft: #F8CD77;
    --amber-ink: #6E4A0C; --live: #6ED6A6; --mark: #F2B23D;
    --shadow: 0 30px 80px -30px rgba(0,0,0,.75), 0 2px 0 rgba(255,255,255,.03) inset;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1100px 520px at 80% -10%, color-mix(in srgb, var(--amber) 9%, transparent), transparent 68%);
    opacity: .55;
    pointer-events: none;
    z-index: 0;
  }
  :root[data-theme="dark"] body::before { opacity: .7; background-image: radial-gradient(1100px 520px at 78% -8%, color-mix(in srgb, var(--amber) 12%, transparent), transparent 70%); }
  a { color: inherit; }
  ::selection { background: color-mix(in srgb, var(--amber) 32%, transparent); color: var(--fg-strong); }

  .wrap { max-width: var(--wrap); margin: 0 auto; padding-inline: var(--pad); position: relative; z-index: 1; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--amber);
    display: inline-flex;
    align-items: center;
    gap: .6em;
    margin: 0 0 18px;
  }
  .eyebrow::before {
    content: "";
    width: 22px; height: 1px;
    background: currentColor;
    opacity: .6;
  }

  h1, h2, h3 { font-family: var(--serif); color: var(--fg-strong); text-wrap: balance; font-weight: 600; }

  /* ---- Top bar ---- */
  header.nav {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: saturate(140%) blur(10px);
    background: color-mix(in srgb, var(--ground) 82%, transparent);
    border-bottom: 1px solid var(--line-soft);
  }
  .nav-in { display: flex; align-items: center; gap: 20px; height: 62px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--serif); font-size: 21px; color: var(--fg-strong); letter-spacing: .01em; }
  .brand .mark { width: 22px; height: 22px; color: var(--mark); display: block; }
  .brand b { font-weight: 600; }
  .nav-links { margin-left: auto; display: flex; align-items: center; gap: 26px; }
  .nav-links a { text-decoration: none; color: var(--muted); font-size: 14.5px; transition: color .15s; }
  .nav-links a:hover { color: var(--fg-strong); }
  .nav-cta {
    font-family: var(--mono); font-size: 13px; letter-spacing: .02em;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 13px;
    color: var(--fg) !important; display: inline-flex; gap: 7px; align-items: center;
    transition: border-color .15s, background .15s;
  }
  .nav-cta:hover { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 8%, transparent); }
  .icon-btn {
    background: none; border: 1px solid var(--line); border-radius: 8px;
    height: 34px; display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); cursor: pointer; transition: border-color .15s, color .15s;
  }
  .icon-btn:hover { border-color: var(--amber); color: var(--fg-strong); }
  .theme-toggle { width: 34px; }
  .theme-toggle svg { width: 16px; height: 16px; }
  .lang-toggle { padding: 0 10px; font-family: var(--mono); font-size: 12px; letter-spacing: .06em; }
  @media (max-width: 720px) { .nav-links a.hide-sm { display: none; } }

  /* ---- Hero ---- */
  .hero { padding-top: clamp(48px, 8vw, 96px); padding-bottom: clamp(40px, 7vw, 88px); }
  .hero-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: clamp(32px, 5vw, 72px); align-items: center; }
  @media (max-width: 900px) { .hero-grid { grid-template-columns: 1fr; gap: 40px; } }

  .hero h1 { font-size: clamp(38px, 6.4vw, 68px); line-height: 1.02; letter-spacing: -.015em; margin: 0 0 22px; }
  .hero h1 em { font-style: italic; color: var(--amber); }
  .lede { font-size: clamp(17px, 1.7vw, 19.5px); color: var(--muted); max-width: 34em; margin: 0 0 32px; }
  .lede b { color: var(--fg); font-weight: 600; }

  .cta-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 9px;
    font-family: var(--mono); font-size: 14px; letter-spacing: .01em;
    padding: 13px 20px; border-radius: 10px; text-decoration: none;
    border: 1px solid transparent; transition: transform .12s ease, box-shadow .2s, background .2s, border-color .2s;
  }
  .btn-primary { background: var(--amber); color: var(--amber-ink); font-weight: 600; box-shadow: 0 8px 26px -10px color-mix(in srgb, var(--amber) 60%, transparent); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 34px -12px color-mix(in srgb, var(--amber) 70%, transparent); }
  .btn-ghost { border-color: var(--line); color: var(--fg); }
  .btn-ghost:hover { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 8%, transparent); transform: translateY(-2px); }
  .btn svg { width: 16px; height: 16px; }
  .hero-note { margin-top: 18px; font-size: 13.5px; color: var(--faint); font-family: var(--mono); }
  .hero-note a { color: var(--muted); text-underline-offset: 3px; }
  .hero-note a:hover { color: var(--amber); }

  /* ---- The device (always a dark glowing screen; stays English) ---- */
  .device {
    --scr-line: #1D2536; --scr-dim: #5C6A88; --scr-fg: #C9D3E6;
    background: linear-gradient(180deg, #10141F, #0A0D14);
    border: 1px solid #222C40;
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.75;
  }
  .device-bar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--scr-line); color: var(--scr-dim); font-size: 12px; letter-spacing: .04em; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #303B52; }
  .device-bar .title { margin-left: 6px; }
  .device-bar .agent { margin-left: auto; color: var(--amber-soft); }
  .device-body { padding: 16px 18px 20px; min-height: 320px; color: var(--scr-fg); }
  .device-body .row { display: flex; gap: 12px; white-space: nowrap; }
  .device-body .k { color: var(--scr-dim); width: 78px; flex: none; }
  .device-body .v { color: var(--scr-fg); overflow: hidden; text-overflow: ellipsis; }
  .device-body .v .doc { color: var(--amber-soft); }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 1px 10px; border-radius: 999px; font-size: 12px;
    border: 1px solid var(--scr-line);
  }
  .pill .led { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .pill.running { color: var(--live); }
  .pill.init { color: var(--scr-dim); }
  .pill.done { color: var(--amber); }
  .log { margin-top: 14px; border-top: 1px dashed var(--scr-line); padding-top: 12px; display: flex; flex-direction: column; gap: 3px; min-height: 132px; }
  .log .line { display: flex; gap: 10px; }
  .log .g { color: var(--scr-dim); flex: none; }
  .log .t { color: var(--scr-fg); }
  .log .t .doc { color: var(--amber-soft); }
  .log .ok { color: var(--live); }
  .caret { display: inline-block; width: 8px; height: 15px; background: var(--amber); vertical-align: -2px; margin-left: 2px; animation: blink 1.05s steps(1) infinite; }
  a.device { display: block; text-decoration: none; color: inherit; cursor: pointer; transition: transform .15s, box-shadow .15s; }
  a.device:hover { transform: translateY(-2px); box-shadow: 0 18px 44px -24px rgba(0,0,0,.55); }
  .device-foot { margin-top: 13px; font-family: var(--mono); font-size: 12px; color: var(--scr-dim); letter-spacing: .03em; transition: color .15s; }
  a.device:hover .device-foot { color: var(--amber); }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---- generic section ---- */
  section { padding-block: clamp(56px, 8vw, 104px); position: relative; z-index: 1; }
  .rule { border: none; border-top: 1px solid var(--line-soft); margin: 0; }
  .sec-head { max-width: 40em; margin-bottom: clamp(34px, 5vw, 52px); }
  .sec-head h2 { font-size: clamp(27px, 3.6vw, 40px); line-height: 1.1; letter-spacing: -.01em; margin: 0 0 14px; }
  .sec-head p { color: var(--muted); font-size: 17px; margin: 0; max-width: 36em; }

  /* ---- statement (origin / AI-coded) ---- */
  .statement h2 { font-size: clamp(30px, 4.6vw, 52px); line-height: 1.05; letter-spacing: -.015em; margin: 0 0 20px; }
  .statement h2 em { color: var(--amber); font-style: italic; }
  .statement p { color: var(--muted); font-size: clamp(17px, 1.7vw, 19px); max-width: 42em; margin: 0; }
  .statement p em { color: var(--fg); font-style: italic; }

  /* ---- pillars ---- */
  .pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line-soft); border: 1px solid var(--line-soft); border-radius: 16px; overflow: hidden; }
  @media (max-width: 900px) { .pillars { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 540px) { .pillars { grid-template-columns: 1fr; } }
  .pillar { background: var(--raised); padding: 26px 24px 30px; display: flex; flex-direction: column; gap: 10px; transition: background .18s; }
  .pillar:hover { background: var(--raised-2); }
  .pillar .idx { font-family: var(--mono); font-size: 12px; color: var(--amber); letter-spacing: .1em; }
  .pillar h3 { font-size: 20px; margin: 2px 0 2px; line-height: 1.2; }
  .pillar p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
  .pillar code { font-family: var(--mono); font-size: 12.5px; color: var(--fg); background: color-mix(in srgb, var(--amber) 10%, transparent); padding: 1px 5px; border-radius: 4px; }

  /* ---- kits ---- */
  .kit-chain { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 4px 0 22px; font-family: var(--mono); font-size: 14px; }
  .kit-node { padding: 7px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised-2); color: var(--fg-strong); font-weight: 600; }
  .kit-arrow { color: var(--amber); font-size: 15px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
  .chip { font-family: var(--mono); font-size: 13px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--raised); color: var(--muted); }
  .chip.plus { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 45%, var(--line)); background: color-mix(in srgb, var(--amber) 7%, transparent); }
  .kit-note { color: var(--muted); font-size: 16.5px; max-width: 44em; margin: 0; }
  .kit-note em { color: var(--fg-strong); font-style: italic; }

  /* ---- engines / under-the-hood index ---- */
  .engines-wrap { border: 1px solid var(--line); border-radius: 16px; background: var(--raised-2); overflow: hidden; }
  .engines { display: grid; grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 820px) { .engines { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .engines { grid-template-columns: 1fr; } }
  .eng { padding: 16px 20px; border-right: 1px solid var(--line-soft); border-top: 1px solid var(--line-soft); display: flex; align-items: baseline; gap: 12px; transition: background .15s; }
  .eng:hover { background: color-mix(in srgb, var(--amber) 7%, transparent); }
  .eng .name { font-family: var(--mono); font-size: 14.5px; color: var(--fg-strong); font-weight: 600; }
  .eng .role { font-size: 13.5px; color: var(--muted); margin-left: auto; text-align: right; }
  .engines-foot { padding: 16px 20px; border-top: 1px solid var(--line); color: var(--faint); font-family: var(--mono); font-size: 12.5px; letter-spacing: .02em; }
  .engines-foot .live { color: var(--live); }

  /* ---- cards (clients + apps) ---- */
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  @media (max-width: 820px) { .cards { grid-template-columns: 1fr; } }
  .card { border: 1px solid var(--line); border-radius: 14px; padding: 24px; background: var(--raised); }
  .card .tag { font-family: var(--mono); font-size: 12px; color: var(--amber); letter-spacing: .06em; }
  .card h3 { font-size: 19px; margin: 4px 0 8px; }
  .card p { margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.6; }
  a.card { display: block; text-decoration: none; color: inherit; transition: border-color .15s, transform .15s, box-shadow .15s; }
  a.card:hover { border-color: var(--amber); transform: translateY(-2px); box-shadow: 0 12px 32px -20px rgba(0,0,0,.4); }
  a.card h3 { display: flex; align-items: baseline; gap: 6px; }
  a.card h3::after { content: "↗"; color: var(--amber); font-size: .72em; opacity: 0; transition: opacity .15s; }
  a.card:hover h3::after { opacity: 1; }
  .apps-more { color: var(--muted); font-family: var(--mono); font-size: 13px; margin: 22px 0 0; }

  /* ---- closer ---- */
  .closer { background: var(--raised-2); border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); }
  .closer-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: clamp(28px,5vw,64px); align-items: center; }
  @media (max-width: 820px) { .closer-grid { grid-template-columns: 1fr; } }
  .closer h2 { font-size: clamp(26px, 3.4vw, 38px); line-height: 1.12; margin: 0 0 18px; }
  .closer p { color: var(--muted); font-size: 16.5px; margin: 0 0 16px; max-width: 40em; }
  .closer p b { color: var(--fg); font-weight: 600; }
  .signature { font-family: var(--serif); font-style: italic; font-size: 19px; color: var(--fg-strong); margin-top: 8px; }
  .facts { display: flex; flex-direction: column; gap: 14px; font-family: var(--mono); font-size: 13.5px; }
  .fact { display: flex; gap: 14px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); }
  .fact .fk { color: var(--amber); flex: none; width: 76px; }
  .fact .fv { color: var(--fg); }

  /* ---- footer ---- */
  footer { padding-block: 8px 56px; }
  .foot-cols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; padding-block: 44px 40px; }
  @media (max-width: 820px) { .foot-cols { grid-template-columns: repeat(2, 1fr); gap: 30px 24px; } }
  @media (max-width: 460px) { .foot-cols { grid-template-columns: 1fr; } }
  .foot-col h4 { margin: 0 0 12px; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .foot-col a { display: block; color: var(--faint); text-decoration: none; font-size: 14px; padding: 3px 0; }
  .foot-col a:hover { color: var(--amber); }
  .foot-hint { color: var(--faint); opacity: .55; font-size: .82em; }
  .foot-soon { display: block; color: var(--faint); opacity: .5; font-size: 13px; padding: 3px 0; }
  .foot-bar { display: flex; flex-wrap: wrap; gap: 14px 26px; align-items: center; color: var(--faint); font-size: 13.5px; border-top: 1px solid var(--line-soft); padding-top: 24px; }
  .foot-bar .brand { font-size: 18px; }
  .foot-links { margin-left: auto; display: flex; gap: 22px; flex-wrap: wrap; }
  .foot-links a { color: var(--muted); text-decoration: none; }
  .foot-links a:hover { color: var(--amber); }

  :focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .caret { animation: none; }
    * { scroll-behavior: auto; }
  }

  /* ---- shared pages (apps / agents / connect / trust) ---- */
  .nav-links a.active { color: var(--fg-strong); text-decoration: underline; text-decoration-color: var(--amber); text-underline-offset: 6px; }
  @media (max-width: 980px) { .nav-links { gap: 18px; } }

  .page-hero { padding-top: clamp(44px, 7vw, 84px); padding-bottom: clamp(36px, 5vw, 60px); }
  .page-hero h1 { font-size: clamp(34px, 5.4vw, 58px); line-height: 1.04; letter-spacing: -.015em; margin: 0 0 20px; max-width: 18em; }
  .page-hero h1 em { font-style: italic; color: var(--amber); }
  .page-hero .lede { max-width: 40em; margin-bottom: 26px; }

  .toc { display: flex; flex-wrap: wrap; gap: 10px; }
  .toc a { font-family: var(--mono); font-size: 13px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--raised); color: var(--muted); text-decoration: none; transition: border-color .15s, color .15s; }
  .toc a:hover { border-color: var(--amber); color: var(--fg-strong); }

  section[id] { scroll-margin-top: 72px; }

  .cards.c2 { grid-template-columns: repeat(2, 1fr); }
  .cards.c4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 1000px) { .cards.c4 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 820px) { .cards.c2, .cards.c4 { grid-template-columns: 1fr; } }
  .card ul { margin: 12px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; line-height: 1.55; }
  .card ul li { margin: 3px 0; }
  .card code, .feat code, .lede code, .sec-head code, .split p code { font-family: var(--mono); font-size: .86em; color: var(--fg); background: color-mix(in srgb, var(--amber) 10%, transparent); padding: 1px 5px; border-radius: 4px; }
  .badge { display: inline-block; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--amber) 45%, var(--line)); color: var(--amber); background: color-mix(in srgb, var(--amber) 7%, transparent); margin-left: 6px; vertical-align: 2px; }
  .badge.new { color: var(--live); border-color: color-mix(in srgb, var(--live) 45%, var(--line)); background: color-mix(in srgb, var(--live) 8%, transparent); }

  /* feature list — dense two-column index of things, each linked to its spec */
  .feats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line-soft); border: 1px solid var(--line-soft); border-radius: 16px; overflow: hidden; }
  .feats.c3 { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 900px) { .feats.c3 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) { .feats, .feats.c3 { grid-template-columns: 1fr; } }
  .feat { background: var(--raised); padding: 22px 22px 24px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit; transition: background .15s; }
  a.feat:hover { background: var(--raised-2); }
  .feat h3 { font-size: 18px; margin: 0; line-height: 1.25; }
  a.feat h3::after { content: " ↗"; color: var(--amber); font-size: .72em; opacity: 0; transition: opacity .15s; }
  a.feat:hover h3::after { opacity: 1; }
  .feat .kicker { font-family: var(--mono); font-size: 12px; color: var(--amber); letter-spacing: .05em; }
  .feat p { margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.6; }

  /* split — text left, terminal-ish snippet right */
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(28px, 5vw, 64px); align-items: center; }
  @media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
  .split h2 { font-size: clamp(26px, 3.4vw, 38px); line-height: 1.1; margin: 0 0 14px; }
  .split p { color: var(--muted); font-size: 16.5px; margin: 0 0 14px; }
  .split ul { color: var(--muted); font-size: 15.5px; padding-left: 20px; margin: 0; }
  .split ul li { margin: 5px 0; }
