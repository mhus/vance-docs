<style>
  /* Self-hosted fonts (SIL OFL, see assets/fonts/LICENSE-*) — no request to a
     third-party font CDN, so the Datenschutz page stays true. */
  @font-face { font-family: "Inter Tight"; font-style: normal; font-weight: 400; font-display: swap; src: url("{{ '/assets/fonts/inter-tight-400.woff2' | relative_url }}") format("woff2"); }
  @font-face { font-family: "Inter Tight"; font-style: normal; font-weight: 500; font-display: swap; src: url("{{ '/assets/fonts/inter-tight-500.woff2' | relative_url }}") format("woff2"); }
  @font-face { font-family: "Inter Tight"; font-style: normal; font-weight: 600; font-display: swap; src: url("{{ '/assets/fonts/inter-tight-600.woff2' | relative_url }}") format("woff2"); }
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 400; font-display: swap; src: url("{{ '/assets/fonts/inter-400.woff2' | relative_url }}") format("woff2"); }
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 500; font-display: swap; src: url("{{ '/assets/fonts/inter-500.woff2' | relative_url }}") format("woff2"); }
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 600; font-display: swap; src: url("{{ '/assets/fonts/inter-600.woff2' | relative_url }}") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 400; font-display: swap; src: url("{{ '/assets/fonts/jetbrains-mono-400.woff2' | relative_url }}") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 500; font-display: swap; src: url("{{ '/assets/fonts/jetbrains-mono-500.woff2' | relative_url }}") format("woff2"); }

  :root {
    /* Light is the default look: white field, ink type, one loud signal
       colour, a lime ticker and dark slabs for rhythm. */
    --ground: #FFFFFF;
    --raised: #F4F3EF;
    --raised-2: #FFFFFF;
    --line: #E2E0DA;
    --line-soft: #ECEAE5;
    --fg: #2B2B30;
    --fg-strong: #111113;
    --muted: #5E5E66;
    --faint: #8B8B93;
    --accent: #FF4F1F;
    --accent-2: #FF8A3D;
    --accent-ink: #FFFFFF;
    --accent-text: #D93A0E;
    --lime: #D9F74A;
    --lime-ink: #111113;
    --slab: #141416;
    --slab-2: #1C1C1F;
    --slab-line: #2B2B30;
    --slab-fg: #E9E9EC;
    --slab-muted: #A2A2AB;
    --btn: #111113;
    --btn-ink: #FFFFFF;
    --live: #138A57;
    --shadow: 0 30px 70px -36px rgba(17,17,19,.45);

    --display: "Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;

    --wrap: 1240px;
    --pad: clamp(16px, 4.5vw, 56px);
    --r: 6px;
  }

  :root[data-theme="dark"] {
    --ground: #0E0E10;
    --raised: #18181B;
    --raised-2: #1E1E22;
    --line: #2A2A30;
    --line-soft: #222227;
    --fg: #E6E6EA;
    --fg-strong: #FFFFFF;
    --muted: #A4A4AE;
    --faint: #6E6E78;
    --accent: #FF6A3D;
    --accent-2: #FF9A55;
    --accent-ink: #FFFFFF;
    --accent-text: #FF8A5F;
    --slab: #18181B;
    --slab-2: #202024;
    --slab-line: #2E2E34;
    --btn: #FFFFFF;
    --btn-ink: #111113;
    --live: #5FD49E;
    --shadow: 0 30px 80px -30px rgba(0,0,0,.8);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; }
  ::selection { background: var(--lime); color: var(--lime-ink); }

  .wrap { max-width: var(--wrap); margin: 0 auto; padding-inline: var(--pad); position: relative; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--fg-strong);
    margin: 0 0 20px;
  }

  h1, h2, h3 { font-family: var(--display); color: var(--fg-strong); text-wrap: balance; font-weight: 500; letter-spacing: -.025em; }
  h1 em, h2 em { font-style: normal; color: var(--accent); }

  /* ---- Top bar ---- */
  header.nav {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in srgb, var(--ground) 94%, transparent);
    backdrop-filter: saturate(140%) blur(10px);
    border-bottom: 1px solid var(--line-soft);
  }
  .nav-in { display: flex; align-items: center; gap: 28px; height: 72px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--display); font-size: 23px; font-weight: 600; letter-spacing: -.03em; color: var(--fg-strong); }
  .brand .mark { width: 24px; height: 24px; color: var(--accent); display: block; }
  .brand b { font-weight: 600; }
  .nav-links { display: flex; align-items: center; gap: 26px; }
  .nav-links a { text-decoration: none; color: var(--fg); font-size: 15.5px; transition: color .15s; }
  .nav-links a:hover { color: var(--accent-text); }
  .nav-links a.active { color: var(--fg-strong); box-shadow: inset 0 -2px 0 var(--accent); padding-bottom: 3px; }
  .nav-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .nav-cta {
    display: inline-flex; gap: 8px; align-items: center; text-decoration: none;
    font-size: 15px; font-weight: 500; padding: 9px 16px; border-radius: 4px;
    border: 1.5px solid var(--fg-strong); color: var(--fg-strong); transition: background .15s, color .15s;
  }
  .nav-cta:hover { background: var(--fg-strong); color: var(--ground); }
  .nav-cta.solid { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
  .nav-cta.solid:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .icon-btn {
    background: none; border: 1px solid var(--line); border-radius: 4px;
    height: 38px; display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); cursor: pointer; transition: border-color .15s, color .15s;
  }
  .icon-btn:hover { border-color: var(--fg-strong); color: var(--fg-strong); }
  .theme-toggle { width: 38px; }
  .theme-toggle svg { width: 16px; height: 16px; }
  .lang-toggle { padding: 0 11px; font-family: var(--mono); font-size: 12px; letter-spacing: .06em; }
  .lang-toggle { gap: 6px; }
  .lang { position: relative; }
  .lang-menu {
    position: absolute; right: 0; top: calc(100% + 8px); z-index: 60; min-width: 172px;
    background: var(--raised-2); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: 0 12px 32px rgba(0,0,0,.12); padding: 6px; display: flex; flex-direction: column;
  }
  .lang-menu[hidden] { display: none; }
  .lang-menu button {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer;
    background: none; border: 0; border-radius: 4px; padding: 9px 10px;
    font-family: var(--sans); font-size: 14.5px; color: var(--fg-strong);
  }
  .lang-menu button:hover { background: var(--raised); }
  .lang-menu button[aria-checked="true"] { box-shadow: inset 3px 0 0 var(--accent); }
  .lang-menu .code { font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; color: var(--muted); width: 20px; }
  .i18n-loading main, .i18n-loading .nav-links { visibility: hidden; }

  /* Japanese: Inter has no CJK glyphs — use the platform's Japanese face, and
     drop the tight Latin tracking, which crushes kana. */
  :root[lang="ja"] { --display: "Inter Tight", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Meiryo", sans-serif;
                     --sans: "Inter", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Meiryo", sans-serif; }
  :root[lang="ja"] h1, :root[lang="ja"] h2, :root[lang="ja"] h3 { letter-spacing: 0; word-break: auto-phrase; line-height: 1.2; }
  :root[lang="ja"] p, :root[lang="ja"] li { line-break: strict; }
  /* Simplified Chinese: same treatment with the platform's Chinese face. */
  :root[lang="zh"] { --display: "Inter Tight", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
                     --sans: "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
  :root[lang="zh"] h1, :root[lang="zh"] h2, :root[lang="zh"] h3 { letter-spacing: 0; line-height: 1.2; }
  :root[lang="zh"] p, :root[lang="zh"] li { line-break: strict; }
  @media (max-width: 1060px) { .nav-links { gap: 18px; } .nav-links a { font-size: 14.5px; } .nav-cta .gh-label { display: none; } }
  @media (max-width: 860px) { .nav-links { display: none; } }
  .nav-cta { white-space: nowrap; }
  @media (max-width: 480px) { .nav-cta.gh { display: none; } .nav-in { gap: 10px; } .nav-actions { gap: 6px; } .nav-cta.solid { padding: 8px 12px; font-size: 14px; } .brand { font-size: 20px; } .lang-toggle { padding: 0 8px; } .lang-toggle svg { display: none; } .theme-toggle { width: 34px; } .icon-btn { height: 34px; } }

  /* ---- Hero ---- */
  .hero { padding-top: clamp(48px, 7vw, 92px); padding-bottom: clamp(56px, 8vw, 104px); overflow: hidden; }
  .hero-grid > div:first-child { position: relative; z-index: 2; }
  @media (max-width: 940px) { .hero-visual::before { width: 46%; left: 30%; height: 150%; top: -15%; } }
  .hero-grid { display: grid; grid-template-columns: 1.08fr .92fr; gap: clamp(32px, 5vw, 72px); align-items: center; }
  @media (max-width: 940px) { .hero-grid { grid-template-columns: 1fr; gap: 48px; } }

  .hero h1 { font-size: clamp(46px, 7.4vw, 92px); line-height: .98; letter-spacing: -.035em; margin: 0 0 26px; }
  .lede { font-size: clamp(18px, 1.8vw, 21px); color: var(--fg); max-width: 32em; margin: 0 0 34px; line-height: 1.5; }
  .lede b { color: var(--fg-strong); font-weight: 600; }

  .release-pill {
    display: inline-flex; align-items: center; gap: 10px; margin: 0 0 28px;
    font-family: var(--mono); font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase;
    text-decoration: none; color: var(--fg-strong);
    padding: 6px 12px 6px 6px; border-radius: 999px; background: var(--raised);
    transition: background .15s;
  }
  .release-pill .v { background: var(--lime); color: var(--lime-ink); padding: 3px 9px; border-radius: 999px; font-weight: 500; }
  .release-pill:hover { background: var(--line-soft); }

  .cta-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--sans); font-size: 16px; font-weight: 500;
    padding: 15px 24px; border-radius: 4px; text-decoration: none;
    border: 1.5px solid transparent; transition: background .15s, color .15s, border-color .15s;
  }
  .btn-primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
  .btn-primary:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-ghost { border-color: var(--fg-strong); color: var(--fg-strong); }
  .btn-ghost:hover { background: var(--fg-strong); color: var(--ground); }
  .btn svg { width: 17px; height: 17px; }
  .hero-note { margin-top: 22px; font-size: 14px; color: var(--muted); }
  .hero-note a { color: var(--fg-strong); text-underline-offset: 3px; }
  .hero-note a:hover { color: var(--accent-text); }

  /* the swoosh behind the device */
  .hero-visual { position: relative; padding: 28px 0; }
  .hero-visual::before {
    content: ""; position: absolute; z-index: 0;
    width: 40%; height: 260%; top: -80%; left: 38%;
    border-radius: 999px;
    background: linear-gradient(170deg, var(--accent-2), var(--accent) 50%, #E8380C);
    transform: rotate(32deg);
    filter: saturate(1.05);
  }
  .hero-visual > * { position: relative; z-index: 1; }

  /* ---- The device (always a dark screen; stays English) ---- */
  .device {
    --scr-line: #24242A; --scr-dim: #6F6F7A; --scr-fg: #DADAE0; --scr-hi: #FFB38A; --scr-ok: #7BE3AE;
    background: #121214;
    border: 1px solid #26262C;
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.75;
  }
  .device-bar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--scr-line); color: var(--scr-dim); font-size: 12px; letter-spacing: .04em; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #34343B; }
  .dot:nth-child(1) { background: #FF5F57; } .dot:nth-child(2) { background: #FEBC2E; } .dot:nth-child(3) { background: #28C840; }
  .device-bar .title { margin-left: 6px; }
  .device-bar .agent { margin-left: auto; color: var(--scr-hi); }
  .device-body { padding: 18px 20px 20px; min-height: 330px; color: var(--scr-fg); }
  .device-body .row { display: flex; gap: 12px; white-space: nowrap; }
  .device-body .k { color: var(--scr-dim); width: 84px; flex: none; }
  .device-body .v { color: var(--scr-fg); overflow: hidden; text-overflow: ellipsis; }
  .device-body .v .doc { color: var(--scr-hi); }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 1px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--scr-line); }
  .pill .led { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .pill.running { color: var(--scr-ok); }
  .pill.init { color: var(--scr-dim); }
  .pill.done { color: #D9F74A; }
  .log { margin-top: 14px; border-top: 1px dashed var(--scr-line); padding-top: 12px; display: flex; flex-direction: column; gap: 3px; min-height: 132px; }
  .log .line { display: flex; gap: 10px; }
  .log .g { color: var(--scr-dim); flex: none; }
  .log .t { color: var(--scr-fg); }
  .log .t .doc { color: var(--scr-hi); }
  .log .ok { color: var(--scr-ok); }
  .caret { display: inline-block; width: 8px; height: 15px; background: #D9F74A; vertical-align: -2px; margin-left: 2px; animation: blink 1.05s steps(1) infinite; }
  a.device { display: block; text-decoration: none; color: inherit; cursor: pointer; transition: transform .2s; }
  a.device:hover { transform: translateY(-3px); }
  .device-foot { margin-top: 13px; font-size: 12px; color: var(--scr-dim); letter-spacing: .03em; transition: color .15s; }
  a.device:hover .device-foot { color: #D9F74A; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---- generic section ---- */
  section { padding-block: clamp(64px, 9vw, 120px); position: relative; }
  .rule { display: none; }
  .sec-head { max-width: 46em; margin-bottom: clamp(36px, 5vw, 56px); }
  .sec-head h2 { font-size: clamp(32px, 4.6vw, 56px); line-height: 1.02; letter-spacing: -.03em; margin: 0 0 18px; }
  .sec-head p { color: var(--muted); font-size: 18px; margin: 0; max-width: 38em; }
  .sec-head p em { color: var(--fg-strong); font-style: normal; font-weight: 500; }
  section.tint { background: var(--raised); }

  /* ---- statement ---- */
  .statement h2 { font-size: clamp(36px, 5.6vw, 72px); line-height: 1; letter-spacing: -.035em; margin: 0 0 26px; max-width: 15em; }
  .statement p { color: var(--muted); font-size: clamp(18px, 1.8vw, 21px); max-width: 40em; margin: 0; line-height: 1.55; }
  .statement .pillars { margin-top: 56px; }
  .statement p em { color: var(--fg-strong); font-style: normal; font-weight: 500; }

  /* ---- dark slab ---- */
  section.slab, .slab { background: var(--slab); color: var(--slab-fg); }
  .slab h2, .slab h3 { color: #FFFFFF; }
  .slab .eyebrow { color: #FFFFFF; }
  .slab p, .slab .sec-head p, .slab.statement p { color: var(--slab-muted); }
  .slab .statement p em, .slab.statement p em, .slab em { color: #FFFFFF; }
  .slab .chip { background: var(--slab-2); border-color: var(--slab-line); color: var(--slab-fg); }
  .slab .kit-node { background: var(--slab-2); border-color: var(--slab-line); color: #FFFFFF; }
  .slab .kit-note { color: var(--slab-muted); }
  .slab .kit-note em { color: #FFFFFF; }

  /* ---- signal band (under the hero) ---- */
  .signal { background: var(--accent); color: var(--accent-ink); padding-block: 22px; }
  .signal-in { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 36px; }
  .signal .lead { font-family: var(--display); font-size: 21px; font-weight: 500; letter-spacing: -.01em; line-height: 1.2; max-width: 15em; }
  .signal ul { display: flex; flex-wrap: wrap; gap: 10px 30px; list-style: none; margin: 0; padding: 0; flex: 1; justify-content: flex-end; }
  @media (max-width: 1100px) { .signal ul { justify-content: flex-start; } }
  .signal li { font-family: var(--mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; opacity: .95; white-space: nowrap; }
  .signal li::before { content: "✳ "; opacity: .7; }

  /* ---- lime ticker ---- */
  .ticker { background: var(--lime); color: var(--lime-ink); overflow: hidden; padding-block: 26px; border-block: 1px solid color-mix(in srgb, var(--lime-ink) 12%, transparent); }
  .ticker-track { display: flex; width: max-content; animation: ticker 48s linear infinite; }
  .ticker:hover .ticker-track { animation-play-state: paused; }
  .ticker-set { display: flex; align-items: center; gap: 56px; padding-right: 56px; }
  .tick { display: flex; align-items: center; gap: 16px; white-space: nowrap; }
  .tick .n { font-family: var(--display); font-size: clamp(38px, 5vw, 60px); font-weight: 500; letter-spacing: -.04em; line-height: 1; }
  .tick .l { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; line-height: 1.35; max-width: 13em; white-space: normal; }
  .tick-sep { font-size: 30px; line-height: 1; }
  @keyframes ticker { to { transform: translateX(-50%); } }

  /* ---- pillars — open grid with top rules ---- */
  .pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 44px 40px; }
  @media (max-width: 900px) { .pillars { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .pillars { grid-template-columns: 1fr; } }
  .pillar { border-top: 1.5px solid var(--fg-strong); padding-top: 18px; display: flex; flex-direction: column; gap: 8px; }
  .pillar .idx { font-family: var(--mono); font-size: 12.5px; color: var(--accent-text); letter-spacing: .1em; }
  .pillar h3 { font-size: 24px; margin: 0; line-height: 1.15; }
  .pillar p { margin: 0; color: var(--muted); font-size: 15.5px; line-height: 1.6; }
  .pillar code { font-family: var(--mono); font-size: 13px; color: var(--fg-strong); background: var(--raised); padding: 1px 5px; border-radius: 3px; }

  /* ---- kits ---- */
  .kit-chain { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 4px 0 22px; font-family: var(--mono); font-size: 14px; }
  .kit-node { padding: 8px 15px; border: 1px solid var(--line); border-radius: 4px; background: var(--raised-2); color: var(--fg-strong); font-weight: 500; }
  .kit-arrow { color: var(--accent); font-size: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
  .chip { font-family: var(--mono); font-size: 13px; padding: 7px 13px; border: 1px solid var(--line); border-radius: 999px; background: var(--raised-2); color: var(--fg); }
  .chip.plus { color: var(--lime-ink); border-color: var(--lime); background: var(--lime); }
  .kit-note { color: var(--muted); font-size: 17px; max-width: 44em; margin: 0; }
  .kit-note em { color: var(--fg-strong); font-style: normal; font-weight: 500; }
  .kit-note code { font-family: var(--mono); font-size: .85em; }

  /* ---- engines index ---- */
  .engines-wrap { border: 1px solid var(--line); border-radius: var(--r); background: var(--raised-2); overflow: hidden; }
  .engines { display: grid; grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 820px) { .engines { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .engines { grid-template-columns: 1fr; } }
  .eng { padding: 16px 20px; border-right: 1px solid var(--line-soft); border-top: 1px solid var(--line-soft); display: flex; align-items: baseline; gap: 12px; transition: background .15s; }
  .eng:hover { background: var(--raised); }
  .eng .name { font-family: var(--mono); font-size: 14.5px; color: var(--fg-strong); font-weight: 500; }
  .eng .role { font-size: 13.5px; color: var(--muted); margin-left: auto; text-align: right; }
  .engines-foot { padding: 16px 20px; border-top: 1px solid var(--line); color: var(--faint); font-family: var(--mono); font-size: 12.5px; letter-spacing: .02em; }
  .engines-foot .live { color: var(--live); }
  .eng-group { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-strong); padding: 14px 20px 8px; border-top: 1px solid var(--line); grid-column: 1 / -1; background: var(--raised); }
  .engines .eng-group:first-child { border-top: none; }
